<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>usaKi bubble</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 152px; height: 188px; position: relative; font-family: Inter, system-ui, sans-serif; color: #e0e2ea; filter: drop-shadow(0 4px 18px rgba(0,0,0,0.55)); opacity: {{opacity}};">
  <svg width="152" height="48" viewBox="0 0 152 48" aria-hidden="true" style="position: absolute; left: 0; top: 0;">
    <sc-for list="{{ears}}" as="ear" hint-placeholder-count="2">
      <sc-for list="{{ear.facets}}" as="f" hint-placeholder-count="5">
        <polygon points="{{f.pts}}" fill="{{f.fill}}"></polygon>
      </sc-for>
      <polyline points="{{ear.edge}}" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-linejoin="miter"></polyline>
    </sc-for>
  </svg>
  <div style="position: absolute; left: 0; top: 36px; width: 152px; height: 152px;">
  <div style="position: absolute; inset: 0; clip-path: polygon(25% 6.7%, 75% 6.7%, 100% 50%, 75% 93.3%, 25% 93.3%, 0 50%); background: rgba(22,24,33,0.88); backdrop-filter: blur(16px) saturate(140%);"></div>
  <svg width="152" height="152" viewBox="0 0 152 152" aria-hidden="true" style="position: absolute; inset: 0;">
    <path d="{{outline}}" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"></path>
    <sc-for list="{{rings}}" as="ring" hint-placeholder-count="4">
      <path d="{{ring.d}}" fill="none" stroke="#252836" stroke-width="{{ring.sw}}"></path>
      <path d="{{ring.d}}" fill="none" stroke="{{ring.color}}" stroke-width="{{ring.sw}}" stroke-opacity="{{ring.op}}" pathLength="100" stroke-dasharray="{{ring.dash}}" stroke-linecap="butt"></path>
    </sc-for>
  </svg>
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; pointer-events: none; font-family: 'Fira Code', monospace;">
    <span style="font-size: 9px; line-height: 1.2; color: #a0a4b8;">{{top}}</span>
    <span style="font-size: 17px; font-weight: 600; line-height: 1.1; color: #e0e2ea;">{{centre}}</span>
    <span style="font-size: 10px; line-height: 1.2; color: #a0a4b8;">{{sub}}</span>
  </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"rings":{"editor":null,"tsType":"{pct:number,color:string,dim?:boolean}[]"},"top":{"editor":null,"tsType":"string"},"centre":{"editor":null,"tsType":"string"},"sub":{"editor":null,"tsType":"string"},"dim":{"editor":null,"tsType":"boolean"},"ears":{"editor":null,"tsType":"\"up\" | \"one\" | \"both\""},"$preview":{"width":152,"height":188}}'>
const C = 76;

// The ears sit in a 36 px band above the hex. The hex keeps its 152 x 152
// box at top 36 px, so the root grows to 152 x 188. EAR_BASE is the hex top
// edge in the ear SVG (the 36 px band plus the 11 px gap between the box top
// and the edge), plus 1 px so that no gap shows under the glass.
const EAR_BASE = 48;
const W = 152;

// Chrysaki surface tones for the facets. The inner facet carries amethyst
// from the tri-primary bar.
const FACET_SHADE = '#1c1f2b';
const FACET_BACK = '#252836';
const FACET_LIT = '#363a4f';
const FACET_INNER = '#583090';

// The left ear, standing. Points are [x, y] in the ear SVG. The right ear
// is the mirror image. Every facet is a straight-edged polygon.
const EAR_UP = {
  facets: [
    { pts: [[44, 2], [36, 20], [45, EAR_BASE], [56, EAR_BASE], [50, 22]], fill: FACET_BACK },
    { pts: [[44, 2], [50, 22], [56, EAR_BASE], [67, EAR_BASE], [60, 14]], fill: FACET_LIT },
    { pts: [[47, 10], [56, 18], [60, 43], [53, 43], [50, 24]], fill: FACET_INNER }
  ],
  edge: [[45, EAR_BASE], [36, 20], [44, 2], [60, 14], [67, EAR_BASE]]
};

// The left ear, folded. The stem stands to the fold line, and the tip
// drops outward and down beside the hex. The underside of the flap is darker.
const EAR_FOLD = {
  facets: [
    { pts: [[38, 26], [45, EAR_BASE], [56, EAR_BASE], [50, 24]], fill: FACET_BACK },
    { pts: [[50, 24], [56, EAR_BASE], [67, EAR_BASE], [61, 21]], fill: FACET_LIT },
    { pts: [[50, 27], [58, 25], [60, 43], [53, 43]], fill: FACET_INNER },
    { pts: [[61, 21], [50, 12], [30, 21], [20, 38], [50, 24]], fill: FACET_LIT },
    { pts: [[50, 24], [20, 38], [38, 26]], fill: FACET_SHADE }
  ],
  edge: [[45, EAR_BASE], [38, 26], [20, 38], [30, 21], [50, 12], [61, 21], [67, EAR_BASE]]
};

function pts(list, mirror) {
  return list.map((p) => (mirror ? W - p[0] : p[0]) + ',' + p[1]).join(' ');
}

function ear(shape, mirror) {
  return {
    facets: shape.facets.map((f) => ({ pts: pts(f.pts, mirror), fill: f.fill })),
    edge: pts(shape.edge, mirror)
  };
}

// The ear state comes from the ears prop. Without the prop, the bubble
// derives it: a full ring or a dimmed bubble folds both ears, and a ring at
// 75% or more folds one ear.
function earState(props, rings) {
  if (props.ears === 'up' || props.ears === 'one' || props.ears === 'both') return props.ears;
  if (props.dim || rings.some((g) => g.pct >= 100)) return 'both';
  if (rings.some((g) => g.pct >= 75)) return 'one';
  return 'up';
}

// In the "one" state the right ear folds and the left ear stands.
function ears(state) {
  return [
    ear(state === 'both' ? EAR_FOLD : EAR_UP, false),
    ear(state === 'up' ? EAR_UP : EAR_FOLD, true)
  ];
}

const SAMPLE = [
  { pct: 42, color: '#1a8a6a' },
  { pct: 81, color: '#e06a78' },
  { pct: 18, color: '#1a8a6a' },
  { pct: 9, color: '#1a8a6a', dim: true }
];

// A flat-top hexagon path that starts at the top centre and runs clockwise.
// The ring progress then grows from 12 o'clock.
function hexPath(r) {
  const h = r * 0.8660;
  return 'M ' + C + ' ' + (C - h) +
    ' L ' + (C + r / 2) + ' ' + (C - h) +
    ' L ' + (C + r) + ' ' + C +
    ' L ' + (C + r / 2) + ' ' + (C + h) +
    ' L ' + (C - r / 2) + ' ' + (C + h) +
    ' L ' + (C - r) + ' ' + C +
    ' L ' + (C - r / 2) + ' ' + (C - h) + ' Z';
}

class Component extends DCLogic {
  renderVals() {
    const rings = this.props.rings ?? SAMPLE;
    const dense = rings.length > 4;
    const step = dense ? 8 : 10;
    const sw = dense ? 5 : 6;
    return {
      outline: hexPath(75),
      ears: ears(earState(this.props, rings)),
      opacity: this.props.dim ? 0.55 : 1,
      top: this.props.top ?? 'next 5h',
      centre: this.props.centre ?? '47m',
      sub: this.props.sub ?? 'acc2 · 81%',
      rings: rings.map((g, i) => ({
        d: hexPath(66 - i * step),
        sw: sw,
        color: g.color,
        op: g.dim ? 0.35 : 1,
        dash: Math.max(0, Math.min(100, g.pct)) + ' 100'
      }))
    };
  }
}
</script>
</body>
</html>
