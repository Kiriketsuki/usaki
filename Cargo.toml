[workspace]
resolver = "3"
members = ["crates/usaki-core", "src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
usaki-core = { path = "crates/usaki-core" }
